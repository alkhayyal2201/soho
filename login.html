<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soho Group — Sign in</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/3/3.1.0/iconify.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<script>
tailwind.config={theme:{extend:{colors:{cream:{50:'#FDFCFA',100:'#FAF7F2',200:'#F5EFE3',300:'#EDE5D5'},gold:{50:'#FBF6ED',100:'#F5EFE3',200:'#E8D5B0',300:'#D4B978',400:'#C9A96E',500:'#A8894F',600:'#8B7240',700:'#6E5A32'},charcoal:{50:'#8A8178',100:'#6B6560',200:'#4A4540',300:'#2C2C2C'}},fontFamily:{playfair:['"Playfair Display"','serif'],lato:['Lato','sans-serif']}}}}
</script>
<style>
body{font-family:'Lato',sans-serif}
.bg-pattern{background-image:radial-gradient(ellipse at 15% 30%,rgba(201,169,110,.06) 0%,transparent 55%),radial-gradient(ellipse at 85% 20%,rgba(201,169,110,.04) 0%,transparent 50%),radial-gradient(ellipse at 50% 85%,rgba(201,169,110,.05) 0%,transparent 55%)}
.ornament{display:inline-flex;align-items:center;gap:10px;color:#C9A96E;font-size:10px;letter-spacing:.2em}
.ornament::before,.ornament::after{content:'';width:50px;height:1px;background:#C9A96E}
.edit-input{background:#fff;border:1px solid rgba(201,169,110,.3);border-radius:10px;padding:11px 14px;font-size:14px;font-family:'Lato',sans-serif;color:#2C2C2C;width:100%;outline:none;transition:all .2s ease}
.edit-input:focus{border-color:#C9A96E;box-shadow:0 0 0 3px rgba(201,169,110,.12)}
.btn-gold{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(135deg,#C9A96E,#D4B978);color:#fff;padding:12px 22px;border-radius:100px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;border:none;transition:all .25s ease;width:100%}
.btn-gold:hover{transform:translateY(-2px);box-shadow:0 10px 25px rgba(201,169,110,.4)}
.btn-gold:disabled{opacity:.6;cursor:wait;transform:none}
.err{background:rgba(234,67,53,.08);border:1px solid rgba(234,67,53,.3);color:#b94a4a;border-radius:10px;padding:10px 14px;font-size:13px}
.note{background:rgba(201,169,110,.08);border:1px solid rgba(201,169,110,.3);color:#6B6560;border-radius:10px;padding:10px 14px;font-size:13px}
</style>
</head>
<body class="bg-cream-100 text-charcoal-300 bg-pattern min-h-screen flex items-center justify-center px-6 py-12">
<main class="w-full max-w-md">
  <div class="text-center mb-8">
    <img src="https://z-cdn-media.chatglm.cn/files/e41f56d1-00f5-43be-ab53-d385e6349bf9.jpeg?auth_key=1876899052-55dbfcfa37a24229b9b523b240878f85-0-8899d5af5eeb912a148bff28425d967f" alt="SOHO" class="w-36 h-auto mx-auto rounded-xl shadow-lg">
    <div class="ornament mt-6 mb-3">SOHO GROUP</div>
    <h1 class="font-playfair text-3xl font-semibold">Staff <span class="italic text-gold-500">Sign in</span></h1>
    <p class="text-charcoal-50 text-sm mt-2 font-light">Use the username &amp; password given by your admin.<br>There is no self signup.</p>
  </div>

  <div class="bg-white rounded-2xl border border-gold-200/50 p-6 sm:p-8 shadow-xl">
    <div id="errBox" class="err mb-4 hidden"></div>
    <div id="noteBox" class="note mb-4 hidden"></div>

    <!-- step 1: credentials -->
    <form id="loginForm" class="space-y-3" onsubmit="return doLogin(event)">
      <input id="username" class="edit-input" placeholder="Username" autocomplete="username" autocapitalize="none">
      <input id="password" class="edit-input" type="password" placeholder="Password" autocomplete="current-password">
      <button id="loginBtn" class="btn-gold" type="submit"><span class="iconify" data-icon="lucide:log-in" data-width="14"></span> Sign in</button>
    </form>

    <!-- step 2: forced password change (first login with temp password) -->
    <form id="changeForm" class="space-y-3 hidden" onsubmit="return doChange(event)">
      <p class="text-sm font-medium">Welcome, <span id="helloName"></span> — please set your own password to continue.</p>
      <input id="np1" class="edit-input" type="password" placeholder="New password (min 6 characters)" autocomplete="new-password">
      <input id="np2" class="edit-input" type="password" placeholder="Repeat new password" autocomplete="new-password">
      <button id="changeBtn" class="btn-gold" type="submit"><span class="iconify" data-icon="lucide:key-round" data-width="14"></span> Set password &amp; continue</button>
    </form>
  </div>
  <p class="text-center text-xs text-charcoal-50 mt-5 font-light">Forgot your password? Ask an admin to reset it for you.</p>
</main>

<script src="auth.js"></script>
<script>
function nextPage(){
  var m = location.search.match(/[?&]next=([^&]+)/);
  var n = m ? decodeURIComponent(m[1]) : "index.html";
  if (/^https?:|^\//.test(n) && n.charAt(0) === "/") n = "index.html";
  if (/^https?:/.test(n)) n = "index.html";
  return n || "index.html";
}
function showErr(t){ var e=document.getElementById('errBox'); e.textContent=t; e.classList.remove('hidden'); }
function hideErr(){ document.getElementById('errBox').classList.add('hidden'); }
// Already signed in? Go straight in (unless forced to change password).
(function(){
  var s = SohoAuth.get();
  if (s && s.token && s.user && !s.user.mustChangePassword) location.href = nextPage();
})();
function doLogin(ev){
  ev.preventDefault(); hideErr();
  var u = document.getElementById('username').value.trim();
  var p = document.getElementById('password').value;
  if(!u || !p){ showErr('Enter your username and password.'); return false; }
  var btn = document.getElementById('loginBtn'); btn.disabled = true;
  SohoAuth.api('login', {username:u, password:p}).then(function(j){
    SohoAuth.set({token:j.token, user:j.user});
    if (j.user.mustChangePassword) {
      document.getElementById('loginForm').classList.add('hidden');
      document.getElementById('helloName').textContent = j.user.displayName || j.user.username;
      document.getElementById('changeForm').classList.remove('hidden');
      var n = document.getElementById('noteBox');
      n.textContent = 'You are using a temporary password. Set your own password now.';
      n.classList.remove('hidden');
    } else {
      location.href = nextPage();
    }
  }).catch(function(e){ showErr(e.message); btn.disabled = false; });
  return false;
}
function doChange(ev){
  ev.preventDefault(); hideErr();
  var a = document.getElementById('np1').value, b = document.getElementById('np2').value;
  if (a.length < 6){ showErr('New password must be at least 6 characters.'); return false; }
  if (a !== b){ showErr('The two passwords do not match.'); return false; }
  var btn = document.getElementById('changeBtn'); btn.disabled = true;
  SohoAuth.api('change-password', {newPassword:a}).then(function(){
    var s = SohoAuth.get(); s.user.mustChangePassword = false; SohoAuth.set(s);
    location.href = nextPage();
  }).catch(function(e){ showErr(e.message); btn.disabled = false; });
  return false;
}
</script>
</body>
</html>
